<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Reimbursement</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
        }
        h2 { margin-top: 0; color: #111827; text-align: center; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; color: #374151; }
        input, textarea, select { padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; background-color: #ffffff; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        
        .camera-box {
            background-color: #f9fafb;
            border: 2px dashed #d1d5db;
            padding: 25px 20px;
            border-radius: 8px;
            text-align: center;
            position: relative;
            margin: 20px 0;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .camera-box.dragover {
            background-color: #eff6ff;
            border-color: #2563eb;
        }
        .camera-box input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }

        /* Default text for desktop users */
        #fileLabel::before {
            content: "📁 Drag & drop receipt or click to browse";
        }

        /* Responsive adaptation: switch message if the device relies on touch interactions */
        @media (pointer: coarse) {
            #fileLabel::before {
                content: "📸 Tap to take photo or browse";
            }
        }
        
        .btn {
            background-color: #2563eb;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            cursor: pointer;
        }
        .btn:disabled { background-color: #9ca3af; cursor: not-allowed; }
        
        #msg {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Request Reimbursement</h2>
    <form id="receiptForm">
        <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" required>
        </div>
        
        <div class="form-group">
            <label for="date">Expense Date</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label for="category">Expense Category</label>
            <select id="category" required>
                <option value="" disabled selected>Select a category...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input type="number" id="amount" step="0.01" min="0.00" placeholder="0.00" required>
        </div>
        
        <div class="form-group">
            <label for="description">Description / Vendor</label>
            <textarea id="description" rows="2" placeholder="e.g., Target - Office Supplies" required></textarea>
        </div>

        <div class="camera-box" id="dropZone">
            <!-- Text content managed dynamically via CSS pseudo-elements / JS overrides -->
            <span id="fileLabel"></span>
            <input type="file" id="receiptFile" accept="image/*" capture="environment" required>
        </div>

        <div id="msg"></div>
        <button type="submit" class="btn" id="submitBtn">Send to Google Drive</button>
    </form>
</div>

<script>
    // ⚠️ PASTE YOUR GOOGLE APPS SCRIPT WEB APP DEPLOYMENT URL HERE
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyQ5274y2MYWq28nk5VrTZQBRo1Q_3W9VEAQuak4ZmGQRYUkQsedg1PfMdXjFC36mnS/exec";

    // 🛠️ EDIT YOUR CATEGORIES HERE ANYTIME
    const CATEGORIES = [
        "Pack Supplies",
        "Den Supplies",
        "Campout/Hike/Event Supplies",
        "Fundraising Supplies",
        "Leader Registration",
        "Awards/Advancement",
        "Other"
    ];

    // Populate Category Dropdown dynamically
    const categorySelect = document.getElementById('category');
    CATEGORIES.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        categorySelect.appendChild(opt);
    });

    // Autofill today's date
    document.getElementById('date').value = new Date().toISOString().split('T')[0];
    
    let fileDataObj = null;
    const fileInput = document.getElementById('receiptFile');
    const fileLabel = document.getElementById('fileLabel');
    const dropZone = document.getElementById('dropZone');

    // Helper function to process the file data
    function processFile(file) {
        if (!file) return;
        
        // Temporarily clear the CSS pseudo-element rule text during processing
        fileLabel.setAttribute('style', '--label-override: "⏳ Reading image..."');
        fileLabel.textContent = "⏳ Reading image...";
        
        const reader = new FileReader();
        reader.onloadend = function() {
            fileDataObj = {
                base64Str: reader.result.split(',')[1],
                type: file.type,
                name: file.name
            };
            fileLabel.removeAttribute('style');
            fileLabel.textContent = `✅ Ready: ${file.name.substring(0, 18)}...`;
        };
        reader.readAsDataURL(file);
    }

    // Handle File Input Change (Click to browse / Native camera capture)
    fileInput.addEventListener('change', function(e) {
        processFile(e.target.files[0]);
    });

    // Handle Desktop Drag and Drop Visual States
    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        }, false);
    });

    // Handle Desktop File Drop
    dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files.length > 0) {
            fileInput.files = files; // Sync the file list over to the hidden input field
            processFile(files[0]);
        }
    });

    // Handle Submit
    document.getElementById('receiptForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('msg');
        
        // 🔒 CRITICAL CHANGE: Validate that a receipt file has been successfully selected and parsed
        if (!fileDataObj || !fileDataObj.base64Str) {
            msg.style.display = 'block';
            msg.style.backgroundColor = '#fee2e2';
            msg.style.color = '#dc2626';
            msg.textContent = "⚠️ Please upload or take a photo of the receipt first.";
            return;
        }
        
        btn.disabled = true;
        msg.style.display = 'block';
        msg.style.backgroundColor = '#f3f4f6';
        msg.style.color = '#1f2937';
        msg.textContent = "⏳ Uploading to Google Drive...";

        // Payload extended with amount and category fields
        const payload = {
            name: document.getElementById('name').value,
            date: document.getElementById('date').value,
            category: document.getElementById('category').value,
            amount: document.getElementById('amount').value,
            description: document.getElementById('description').value,
            receiptFile: fileDataObj
        };

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            });

            msg.style.backgroundColor = '#dcfce7';
            msg.style.color = '#16a34a';
            msg.textContent = "🎉 Successfully uploaded!";
            
            // Reset everything back to base states
            document.getElementById('receiptForm').reset();
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
            fileLabel.textContent = ""; // Returns it to default CSS string text
            fileDataObj = null;
        } catch (err) {
            msg.style.backgroundColor = '#fee2e2';
            msg.style.color = '#dc2626';
            msg.textContent = "❌ Upload failed. Please try again.";
            console.error(err);
        } finally {
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
